name: daily
on:
  schedule:
    - cron: "10 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      S2: ${{ secrets.S2 }}
      SWID: ${{ secrets.SWID }}
      L: ${{ secrets.L }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: tools
        run: pip install --quiet cryptography
      - name: fetch
        run: node x/fetch.mjs r
      - name: seal
        run: python3 x/vault.py seal r raw.enc x/pipe.pub
      - name: push
        run: |
          git config user.name hq
          git config user.email hq@localhost
          git add raw.enc
          git commit -q -m "Update" || exit 0
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin main && exit 0
            echo "push attempt $i failed, retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((i * 15))
          done
          exit 1
