const S=crypto.subtle,u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const N=0xffffffff00000000ffffffffffffffffbce6faada7179e84f3b9cac2fc632551n;
const hex=a=>[...a].map(x=>x.toString(16).padStart(2,"0")).join("");
const b64u=h=>btoa(String.fromCharCode(...h.match(/../g).map(x=>parseInt(x,16)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function dFrom(pw){const k=await S.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
 const bits=new Uint8Array(await S.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(D.s),iterations:D.n,hash:"SHA-256"},k,256));
 return (BigInt("0x"+hex(bits))%(N-1n)+1n).toString(16).padStart(64,"0");}
async function open_(dh){const priv=await S.importKey("jwk",{kty:"EC",crv:"P-256",d:b64u(dh),x:D.x,y:D.y,ext:true},{name:"ECDH",namedCurve:"P-256"},false,["deriveBits"]);
 const eph=await S.importKey("raw",u(D.e),{name:"ECDH",namedCurve:"P-256"},false,[]);
 const sh=await S.deriveBits({name:"ECDH",public:eph},priv,256);
 const hk=await S.importKey("raw",sh,"HKDF",false,["deriveKey"]);
 const key=await S.deriveKey({name:"HKDF",hash:"SHA-256",salt:new Uint8Array(0),info:new TextEncoder().encode("hq-page")},hk,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await S.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
 const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close();}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const m=document.getElementById("m");m.textContent="Unlocking...";
 try{const dh=await dFrom(document.getElementById("p").value);const rem=document.getElementById("r").checked;await open_(dh);
  if(rem){try{localStorage.setItem("k2",dh)}catch(_){}}}catch(err){m.textContent="Wrong passphrase.";}});
(async()=>{let dh=null;try{localStorage.removeItem("k");dh=localStorage.getItem("k2")}catch(e){}
 if(dh){try{await open_(dh)}catch(e){try{localStorage.removeItem("k2")}catch(_){}}}})();
