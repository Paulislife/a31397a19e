async function keyFrom(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k,{name:"AES-GCM",length:256},true,["decrypt"]);}
async function open_(key){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
 const h=new TextDecoder().decode(pt);document.open();document.write(h);document.close();}
async function tryPw(pw,remember){const key=await keyFrom(pw);await open_(key);
 if(remember){try{localStorage.setItem("k",pw)}catch(e){}}}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const m=document.getElementById("m");m.textContent="Unlocking...";
 try{await tryPw(document.getElementById("p").value,document.getElementById("r").checked)}catch(err){m.textContent="Wrong passphrase.";}});
